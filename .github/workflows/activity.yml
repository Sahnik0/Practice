name: activity

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Skip window/target checks and commit once (testing)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: activity
  cancel-in-progress: false

jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Maybe commit
        env:
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          export TZ=Asia/Kolkata

          git config user.name  "YOUR_GITHUB_USERNAME"
          git config user.email "YOUR_VERIFIED_EMAIL"

          TODAY=$(date +%F)
          HOUR=$((10#$(date +%H)))
          START=9    # first active hour (IST)
          END=23     # last active hour (IST)

          MESSAGES=(
            "update notes" "log progress" "minor tweak" "sync"
            "add entry" "refactor log" "daily checkpoint" "small update"
          )

          make_commit() {
            local ts="$(date '+%Y-%m-%d %H:%M:%S %Z')"
            echo "$ts | $(openssl rand -hex 4)" >> activity.log
            git add activity.log
            git commit -q -m "${MESSAGES[RANDOM % ${#MESSAGES[@]}]}"
          }

          if [ "${FORCE:-false}" = "true" ]; then
            make_commit
            git pull -q --rebase
            git push
            exit 0
          fi

          # Outside active window: do nothing
          if (( HOUR < START || HOUR > END )); then
            echo "Outside window ($HOUR). Exiting."
            exit 0
          fi

          # Daily target (1-4), deterministic per date so every run agrees
          SEED=$(echo "$TODAY" | cksum | cut -d' ' -f1)
          TARGET=$(( SEED % 4 + 1 ))

          DONE=$(git log --since="$TODAY 00:00:00 +0530" \
                         --until="$TODAY 23:59:59 +0530" \
                         --format=%H | wc -l)
          NEED=$(( TARGET - DONE ))
          RUNS_LEFT=$(( END - HOUR + 1 ))

          echo "target=$TARGET done=$DONE need=$NEED runs_left=$RUNS_LEFT"

          if (( NEED <= 0 )); then
            echo "Target met."
            exit 0
          fi

          # Spread remaining commits over remaining runs; guarantee by last run
          if (( NEED >= RUNS_LEFT )); then
            COUNT=$(( NEED - RUNS_LEFT + 1 ))
          elif (( RANDOM % RUNS_LEFT < NEED )); then
            COUNT=1
          else
            echo "Rolled skip this hour."
            exit 0
          fi

          for _ in $(seq "$COUNT"); do
            make_commit
            sleep $(( RANDOM % 3 + 1 ))
          done

          git pull -q --rebase
          git push