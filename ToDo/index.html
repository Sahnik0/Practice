<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Things — a to-do list</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="app__head">
      <div>
        <p class="app__date" id="today"></p>
        <h1 class="app__title">Things to do</h1>
      </div>
      <div class="ring" id="ring" aria-hidden="true">
        <svg viewBox="0 0 44 44">
          <circle class="ring__track" cx="22" cy="22" r="19"></circle>
          <circle class="ring__fill" id="ringFill" cx="22" cy="22" r="19"></circle>
        </svg>
        <span class="ring__pct" id="ringPct">0%</span>
      </div>
    </header>

    <form class="composer" id="composer" autocomplete="off">
      <input
        class="composer__input"
        id="input"
        type="text"
        placeholder="What needs doing?"
        aria-label="New task"
        maxlength="160">
      <button class="composer__add" id="add" type="submit" aria-label="Add task">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
          <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
        </svg>
      </button>
    </form>

    <nav class="filters" id="filters">
      <button class="chip is-active" data-filter="all">All</button>
      <button class="chip" data-filter="active">Active</button>
      <button class="chip" data-filter="done">Done</button>
      <span class="filters__spacer"></span>
      <button class="chip chip--ghost" id="clearDone">Clear done</button>
    </nav>

    <ul class="list" id="list"></ul>

    <div class="empty" id="empty" hidden>
      <div class="empty__mark">✻</div>
      <p class="empty__title">Nothing here yet</p>
      <p class="empty__sub">Add your first task above and get going.</p>
    </div>

    <footer class="app__foot" id="foot" hidden>
      <span id="countLabel">0 left</span>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
